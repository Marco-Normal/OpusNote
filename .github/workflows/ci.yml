name: CI

# The fast tier only. It is the tier the project promises will pass after every edit, and it
# needs nothing exotic: Python, Node, and a bash script that reads the kiosk policy. Measured at
# roughly 75 seconds locally.
#
# The browser tier (`backend/tools/run_e2e.sh`, 14 scenarios) is deliberately not wired in here.
# It drives real Chromium through Playwright and `tools/e2e_browser.py` expects the binary at
# `/usr/bin/chromium`, which is not a path a stock runner guarantees — a red badge that means
# "the runner has no Chromium" teaches nobody anything. It is run locally, and via
# `./check.sh --full`, before anything is published.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: Fast tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          # Not 20. The frontend units are TypeScript run by `node --test`, and Node only
          # learned to strip types itself in 23.6 — on 20 every one of them dies with
          # `ERR_UNKNOWN_FILE_EXTENSION: Unknown file extension ".ts"`. The tier aborted at the
          # backend step before this could be seen, so the pin went on saying 20 while the
          # tests needed 26; see docs/PLAN-PHASE8-9.md §the frontend test runner.
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `check.sh` calls the interpreter at `backend/.venv/bin/python`, so the environment is
      # created where it looks rather than relying on the runner's global Python.
      - name: Create the backend virtualenv
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Install the client
        working-directory: frontend
        run: npm ci

      - name: Verify
        run: ./check.sh --fast
