<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline icon: avoids a favicon round-trip (and a 404) without shipping an asset. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234338ca'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white'%3E%E2%99%AA%3C/text%3E%3C/svg%3E"
    />
    <meta name="description" content="Adaptive sight-reading trainer for a real MIDI piano." />
    <title>Sight-Reading Trainer</title>
    <!--
      Resolve the theme before first paint so a dark-mode reload never flashes
      white. Kept inline and dependency-free for that reason; `theme.svelte.ts`
      takes over once the app has mounted.
    -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('srt.theme') || 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          var paper = localStorage.getItem('srt.scorePaper') || 'theme';
          root.dataset.scorePaper = paper === 'theme' && dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.scorePaper = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
