# mutmut reads this section; pytest reads pytest.ini. See docs/TEST-STRATEGY.md §5.
#
# The mutation score is a *report*, not a gate, until its baseline is known — 813 tests
# have never been asked whether they can fail, so the first number is a discovery.
[mutmut]
# Mutate the application code, and only it. Tests, tooling and the venv are not sources.
source_paths=app
# `pedal.py` and `metrics.py` are pure functions of a note list, so a mutant there should
# be caught by a fast, targeted test rather than by the whole suite.
pytest_add_cli_args=-q
