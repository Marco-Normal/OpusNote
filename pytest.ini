[pytest]
# This workspace root also hosts unrelated projects (piano-progress,
# practice-logger) that each have their own repo and their own test suites.
# Scope collection to this project so a bare `pytest` from the root is
# unambiguous. Running `pytest` from `backend/` also works and is the documented
# workflow.
testpaths = backend/tests
norecursedirs = piano-progress practice-logger frontend node_modules .venv .cache
# A typo'd marker silently does nothing, and a mis-set option silently reverts to a
# default — which is how `-m "not slow"` would stop excluding anything and nobody would
# notice. Both are errors here.
addopts = --strict-markers --strict-config --timeout=120
markers =
    slow: takes more than a second; excluded from the fast tier
